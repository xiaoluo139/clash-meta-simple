name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Meta)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with mihomo submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: |
            core/src/main/golang/go.sum
            core/src/foss/golang/go.sum

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "::notice::检测到签名密钥，release 产物将使用仓库密钥签名"
            echo "${KEYSTORE_BASE64}" | base64 -d > release-ci.keystore
            {
              echo "store.file=release-ci.keystore"
              echo "keystore.password=${KEYSTORE_PASSWORD}"
              echo "key.alias=${KEY_ALIAS}"
              echo "key.password=${KEY_PASSWORD}"
            } > signing.properties
          else
            echo "::notice::未配置签名密钥（secrets），release 产物将回退为 debug 签名"
          fi

      - name: Build debug APKs
        run: ./gradlew :app:assembleMetaDebug --no-daemon --stacktrace

      - name: Build release APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleMetaRelease --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: clash-meta-simple-debug
          path: app/build/outputs/apk/meta/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: clash-meta-simple-release
          path: app/build/outputs/apk/meta/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，跳过上传以避免覆盖手工签名的产物"
          else
            gh release create "$TAG" \
              app/build/outputs/apk/meta/release/*.apk \
              --title "Clash Meta Simple $TAG" \
              --notes "由 GitHub Actions 自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')。"
          fi
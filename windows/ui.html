<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clash Simple</title>
<style>
  :root{
    --bg:#0f1218; --bg2:#151a23; --card:#1a212c; --card2:#212a37;
    --line:rgba(255,255,255,.07); --text:#eef2f8; --muted:#8794a8;
    --primary:#3b82f6; --primary2:#2563eb; --ok:#22c55e; --warn:#f59e0b;
    --bad:#ef4444; --idle:#64748b; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1b2635 0%,var(--bg) 60%);
    color:var(--text); font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;max-width:900px;margin:0 auto;padding:14px 18px 16px;gap:14px}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 4px rgba(100,116,139,.15)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;
    transition:background .18s ease,border-color .18s ease,transform .12s ease;
  }
  .btn:hover{background:var(--card2);border-color:rgba(255,255,255,.16)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(180deg,var(--primary),var(--primary2));border-color:transparent;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}

  /* ---------- 英雄区 ---------- */
  .hero{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px}
  .orb{
    width:158px;height:158px;border-radius:50%;position:relative;cursor:pointer;
    background:radial-gradient(circle at 34% 28%,#6b7688,#464f5e 70%);
    box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
    display:grid;place-items:center;
    transition:transform .18s cubic-bezier(.2,.8,.2,1),background .35s ease,box-shadow .35s ease;
  }
  .orb:hover{transform:translateY(-2px) scale(1.02)}
  .orb:active{transform:scale(.96)}
  .orb.on{background:radial-gradient(circle at 34% 28%,#5da2ff,var(--primary2) 72%);
          box-shadow:0 20px 50px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.25)}
  .orb .ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.14);opacity:0}
  .orb.on .ring{animation:pulse 2.2s ease-out infinite}
  .orb .ring:nth-child(2){animation-delay:1.1s}
  @keyframes pulse{0%{opacity:.5;transform:scale(.94)}70%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
  .orb svg{width:66px;height:66px;stroke:#fff;stroke-width:7;fill:none;stroke-linecap:round;opacity:.95}
  .state{font-size:23px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px}
  .meta{color:var(--muted);font-size:12.5px;min-height:18px}

  /* ---------- 模式分段控件 ---------- */
  .seg{flex:0 0 auto;position:relative;display:flex;background:var(--card);border:1px solid var(--line);
       border-radius:12px;padding:4px;width:100%;max-width:460px;margin:0 auto}
  .seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);
      border-radius:9px;background:linear-gradient(180deg,var(--primary),var(--primary2));
      transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 14px rgba(59,130,246,.35)}
  .seg button{position:relative;flex:1;background:none;border:0;color:var(--muted);
      padding:9px 0;font-size:13.5px;cursor:pointer;transition:color .2s ease;font-family:inherit}
  .seg button.active{color:#fff;font-weight:600}
  /* ---------- 节点面板（占满剩余高度） ---------- */
  .panel{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;
         background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .panel-head .title{font-size:14px;font-weight:700}
  .count{color:var(--muted);font-size:12px}
  .spacer2{flex:1}
  select,input[type=text]{
    background:var(--bg2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;outline:none;
    transition:border-color .18s ease,box-shadow .18s ease}
  select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  select{cursor:pointer;max-width:190px}
  .search{width:150px}

  .list{flex:1 1 auto;overflow-y:auto;padding:6px 8px 10px;min-height:0}
  .list::-webkit-scrollbar{width:10px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  .list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box}

  .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;
       transition:background .15s ease;position:relative}
  .row:hover{background:var(--card2)}
  .row.current{background:rgba(59,130,246,.16);box-shadow:inset 0 0 0 1px rgba(59,130,246,.35)}
  .row.group{cursor:default;opacity:.75}
  .row .tick{width:16px;color:var(--primary);font-size:13px;opacity:0;flex:0 0 auto}
  .row.current .tick{opacity:1}
  .row .name{flex:1 1 auto;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.current .name{font-weight:700}
  .row .tag{flex:0 0 auto;font-size:11px;color:var(--muted);background:rgba(255,255,255,.05);
            border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .row .delay{flex:0 0 auto;min-width:66px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
  .empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
  .loading{color:var(--muted);font-size:12.5px;padding:0 2px}

  /* ---------- 订阅抽屉 ---------- */
  .drawer{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
          padding:0 14px;max-height:0;overflow:hidden;transition:max-height .28s ease,padding .28s ease,opacity .2s ease;opacity:0}
  .drawer.open{max-height:150px;padding:14px;opacity:1}
  .drawer .line{display:flex;gap:8px;align-items:center}
  .drawer input{flex:1 1 auto}
  .hint{color:var(--muted);font-size:11.5px;margin-top:8px}

  /* ---------- Toast ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
    background:rgba(20,26,36,.96);border:1px solid var(--line);color:#fff;padding:11px 18px;border-radius:11px;
    font-size:13px;opacity:0;pointer-events:none;transition:all .26s cubic-bezier(.2,.8,.2,1);max-width:78vw;
    box-shadow:0 12px 34px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="brand"><span class="dot" id="dot"></span>Clash Simple</div>
    <div class="spacer"></div>
    <button class="btn sm" id="btnSub">订阅</button>
    <button class="btn sm" id="btnIp">IP 检测</button>
  </div>

  <div class="hero">
    <div class="orb" id="orb">
      <div class="ring"></div><div class="ring"></div>
      <svg viewBox="0 0 100 100">
        <path d="M50 22 V50"/>
        <path d="M28 34 A30 30 0 1 0 72 34"/>
      </svg>
    </div>
    <div class="state" id="stateText">未连接</div>
    <div class="sub" id="hintText">点击圆环启动代理</div>
    <div class="meta" id="metaText"></div>
  </div>

  <div class="seg" id="seg">
    <div class="thumb" id="thumb"></div>
    <button data-mode="rule" class="active">规则模式</button>
    <button data-mode="global">全局模式</button>
    <button data-mode="direct">直连模式</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="title">节点</span>
      <span class="count" id="nodeCount"></span>
      <div class="spacer2"></div>
      <select id="groupSelect" title="切换节点组"></select>
      <input type="text" class="search" id="search" placeholder="搜索节点…" />
      <button class="btn sm" id="btnTest">测速</button>
      <button class="btn sm primary" id="btnAuto">自动选择最快</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="drawer" id="drawer">
    <div class="line">
      <input type="text" id="profileUrl" placeholder="粘贴 Clash / mihomo 订阅链接（http/https）" />
      <button class="btn primary" id="btnSaveProfile">保存并应用</button>
      <button class="btn" id="btnUpdateProfile">更新订阅</button>
    </div>
    <div class="hint" id="profileHint">保存后会自动重启内核生效；系统代理会随启动/停止自动开关。</div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);

let state = null;
let busy = false;
let currentGroup = '';
let filterText = '';

const MODES = { rule: '规则模式', global: '全局模式', direct: '直连模式' };

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

async function api(path, options) {
  const res = await fetch(path, Object.assign(
    { headers: { 'Content-Type': 'application/json' } }, options || {}));
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { ok: false, error: text }; }
  if (!res.ok) throw new Error((data && data.error) ? data.error : ('HTTP ' + res.status));
  return data;
}

function delayText(d) {
  if (!d || d <= 0) return '未测速';
  if (d >= 65535) return '超时';
  return d + ' ms';
}

function delayColor(d) {
  if (!d || d <= 0) return 'var(--idle)';
  if (d >= 65535) return 'var(--bad)';
  if (d <= 200) return 'var(--ok)';
  if (d <= 500) return 'var(--warn)';
  if (d <= 2000) return '#eab308';
  return 'var(--bad)';
}

/* ---------------- 渲染 ---------------- */

function render() {
  if (!state) return;

  const running = !!state.running;
  $('orb').classList.toggle('on', running);
  $('dot').classList.toggle('on', running);
  $('stateText').textContent = running ? '已连接' : '未连接';
  $('hintText').textContent = running ? '点击圆环断开代理' : '点击圆环启动代理';

  const mode = state.mode || 'rule';
  document.querySelectorAll('#seg button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));

  const idx = mode === 'global' ? 1 : (mode === 'direct' ? 2 : 0);
  $('thumb').style.transform = 'translateX(' + (idx * 100) + '%)';

  const parts = [MODES[mode] || mode];
  if (running && state.now) parts.push(state.now);
  if (running && state.nodeDelay) parts.push(state.nodeDelay + ' ms');
  if (state.version) parts.push(state.version);
  $('metaText').textContent = parts.join(' · ');

  renderGroups();

  const all = state.nodes || [];
  const nodes = all.filter(n => !filterText || n.isGroup ||
                                (n.name || '').toLowerCase().includes(filterText));
  const realCount = all.filter(n => !n.isGroup).length;
  $('nodeCount').textContent = running ? ('共 ' + realCount + ' 个节点') : '';

  const list = $('list');
  list.innerHTML = '';

  if (!running) {
    list.innerHTML = '<div class="empty">先点击圆环启动代理，再选择节点</div>';
    return;
  }
  if (all.length === 0) {
    list.innerHTML = '<div class="empty">这一组没有节点（请检查订阅，或换个节点组）</div>';
    return;
  }
  if (nodes.length === 0) {
    list.innerHTML = '<div class="empty">没有匹配「' + filterText + '」的节点</div>';
    return;
  }

  const frag = document.createDocumentFragment();

  nodes.forEach(n => {
    const row = document.createElement('div');
    row.className = 'row' + (n.name === state.now ? ' current' : '') + (n.isGroup ? ' group' : '');

    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = n.name;

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = n.isGroup ? '节点组' : (n.type || '');

    const delay = document.createElement('span');
    delay.className = 'delay';
    if (n.isGroup) {
      delay.textContent = '—';
      delay.style.color = 'var(--idle)';
    } else {
      delay.textContent = delayText(n.delay);
      delay.style.color = delayColor(n.delay);
    }

    row.appendChild(tick); row.appendChild(name); row.appendChild(tag); row.appendChild(delay);

    if (!n.isGroup) row.addEventListener('click', () => selectNode(n.name));
    frag.appendChild(row);
  });

  list.appendChild(frag);
}

function renderGroups() {
  const sel = $('groupSelect');
  const groups = state.groups || [];
  const names = groups.map(g => (typeof g === 'string') ? g : g.name);

  if (names.length === 0) {
    sel.style.display = 'none';
    return;
  }

  sel.style.display = '';
  const wanted = currentGroup || state.group || names[0];

  if (sel.dataset.filled !== names.join('|')) {
    sel.innerHTML = '';
    names.forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    sel.dataset.filled = names.join('|');
  }

  sel.value = wanted;
}

/* ---------------- 交互 ---------------- */

async function refresh() {
  if (busy) return;
  try {
    const q = currentGroup ? ('?group=' + encodeURIComponent(currentGroup)) : '';
    const next = await api('/api/state' + q);
    state = next;
    if (next.group) currentGroup = next.group;
    render();
  } catch (e) { }
}

async function withBusy(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); } catch (e) { toast(e.message || String(e)); } finally { busy = false; }
}

async function selectNode(name) {
  await withBusy(async () => {
    await api('/api/select?group=' + encodeURIComponent(state.group) +
              '&name=' + encodeURIComponent(name), { method: 'POST', body: '{}' });
    await refresh();
    toast('已选择：' + name);
  });
}

$('orb').addEventListener('click', () => withBusy(async () => {
  const path = (state && state.running) ? '/api/stop' : '/api/start';
  state = await api(path, { method: 'POST', body: '{}' });
  render();
  toast(state.running ? '代理已启动 · 系统代理已开启' : '代理已停止 · 系统代理已还原');
}));

document.querySelectorAll('#seg button').forEach(b => {
  b.addEventListener('click', () => withBusy(async () => {
    await api('/api/mode', { method: 'POST', body: JSON.stringify({ mode: b.dataset.mode }) });
    await refresh();
    toast('已切换到' + b.textContent);
  }));
});

$('groupSelect').addEventListener('change', async e => {
  currentGroup = e.target.value;
  await refresh();
});

$('search').addEventListener('input', e => {
  filterText = e.target.value.trim().toLowerCase();
  render();
});

$('btnTest').addEventListener('click', () => withBusy(async () => {
  if (!state || !state.running) { toast('请先启动代理'); return; }
  toast('正在测速…');
  const r = await api('/api/test?group=' + encodeURIComponent(state.group), { method: 'POST', body: '{}' });
  await refresh();
  toast('测速完成，测通 ' + ((r.delays && Object.keys(r.delays).length) || 0) + ' 个节点');
}));

$('btnAuto').addEventListener('click', () => withBusy(async () => {
  if (!state || !state.running) { toast('请先启动代理'); return; }
  toast('正在测速并挑选最快节点…');
  const r = await api('/api/auto?group=' + encodeURIComponent(state.group), { method: 'POST', body: '{}' });
  await refresh();
  toast(r.ok ? ('已自动选择：' + r.name + '（' + r.delay + ' ms）') : (r.error || '没有可用节点'));
}));

$('btnSub').addEventListener('click', () => {
  $('drawer').classList.toggle('open');
  setTimeout(() => $('profileUrl').focus(), 260);
});

$('btnSaveProfile').addEventListener('click', () => {
  const url = $('profileUrl').value.trim();
  if (!url) { toast('请先填写订阅链接'); return; }
  withBusy(async () => {
    toast('正在下载订阅…');
    await api('/api/profile', { method: 'POST', body: JSON.stringify({ url }) });
    currentGroup = '';
    await refresh();
    toast('订阅已保存并生效');
  });
});

$('btnUpdateProfile').addEventListener('click', () => withBusy(async () => {
  toast('正在更新订阅…');
  await api('/api/update', { method: 'POST', body: '{}' });
  currentGroup = '';
  await refresh();
  toast('订阅已更新');
}));

$('btnIp').addEventListener('click', () => window.open('https://ip.skk.moe/', '_blank'));

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
